# Publica o site no GitHub Pages sempre que há um push para a branch main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Com domínio próprio (ficheiro public/CNAME) o site fica na raiz "/";
      # sem domínio fica em https://<utilizador>.github.io/<repositório>/
      - name: Build de produção
        run: |
          if [ -f public/CNAME ]; then BASE=/; else BASE="/${{ github.event.repository.name }}/"; fi
          npx ng build --base-href "$BASE"

      - name: Página 404 (qualquer caminho desconhecido abre o site)
        run: cp dist/bea-pt-website/browser/index.html dist/bea-pt-website/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bea-pt-website/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
